<!DOCTYPE html>
<!--
  Necropathy Web shell (export_presets.cfg, preset "Web": html/custom_html_shell).
  Godot 4.3's stock page (godot.html: loading bar, error notice, engine start),
  unchanged in behaviour, plus phone and tablet support (GDD 15.0 "Mobile browser
  support"):
    * viewport: device width, no pinch or double-tap zoom, viewport-fit=cover with a
      black-translucent status bar, so the page always covers the whole screen; the
      canvas is then fitted by THIS page into the safe area (fitCanvas() below:
      clear of a notch, the status-bar strip and the home bar), and Godot leaves its
      size alone (export preset html/canvas_resize_policy = 0). On an iPhone Home
      Screen web app in landscape, the page drawn under a reserved status-bar strip
      while touches were measured without it put every tap a fixed distance above the
      finger (owner report, GDD 15.0 "Home Screen touch offset"); one rectangle that
      the page sets itself keeps drawing and touches in the same coordinates;
      no scroll bounce or pull-to-refresh (fixed body,
      overscroll-behavior: none); no text selection, callout or tap highlight on
      the canvas; touch-action: none on the canvas (Godot reads every finger);
    * audio unlock: browsers start audio only from a user gesture, and iOS Safari
      and Chrome only count touchend / click (not touchstart, which is where Godot
      resumes its AudioContext for a finger). Every AudioContext the page creates
      is remembered and resumed (with one silent frame started) on every touchend,
      pointerup, click or key while it is not running, including iOS's
      "interrupted" state after a call or a trip to another app;
    * iPhone sound (GDD 15.0 "iPhone sound and fullscreen"): the page asks for the
      "playback" audio session so the ring / silent switch no longer mutes the game
      (a looping silent <audio> on iOS older than 16.4), and on Apple touch devices
      Godot's AudioContext keeps the hardware sample rate;
    * saves: the page asks for persistent storage (navigator.storage.persist), so the
      browser does not evict the IndexedDB that holds user:// under storage pressure;
    * landscape: a browser can lock the screen orientation only in fullscreen, so
      when the page enters fullscreen on a touch device it asks for landscape
      (screen.orientation.lock; refused quietly where unsupported, e.g. iOS). The
      game shows its own "turn your device" overlay otherwise (RotateOverlay).
    * start gate (GDD 15.0 "GitHub Pages is the web home"): the engine downloads at once,
      but the game starts only on a click / tap / key on the Play button. Godot creates
      its AudioContext while it starts, so it is created inside that gesture and starts
      running at once in every browser (itch.io's "Run game" button used to be this
      gesture). The Web build's silence itself was a bus-order bug, fixed in sfx.gd
      _setup_buses() (GDD 15.0 "Web sound fix").
  Template placeholders ($GODOT_*) are filled by the exporter.
-->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	overscroll-behavior: none;
}

body {
	position: fixed;
	inset: 0;
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	-webkit-text-size-adjust: 100%;
}

#canvas {
	display: block;
	position: fixed;  /* Placed and sized by fitCanvas() inside the safe area. */
	left: 0;
	top: 0;
	touch-action: none;
	user-select: none;
	-webkit-user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas:focus {
	outline: none;
}

/* Never shown: fitCanvas() reads the safe-area insets from its padding. */
#safe-probe {
	position: fixed;
	visibility: hidden;
	pointer-events: none;
	padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #161a1c;  /* The game's ground colour (Palette.GROUND). */
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	/* The NECROPATHY logo (the boot splash, 246 x 90 art px) at a whole-number zoom, sharp pixels. */
	width: min(70vw, 738px);
	height: auto;
	max-height: 100%;
	max-width: 100%;
	margin: auto;
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-play {
	display: none;
	position: absolute;
	bottom: 8%;
	left: 50%;
	transform: translateX(-50%);
	min-width: 12rem;
	padding: 0.7rem 2.4rem;
	border: 0;
	background-color: #6b4fa8;
	color: #f2ecff;
	font: 700 1.6rem/1 'Trebuchet MS', 'Segoe UI', sans-serif;
	letter-spacing: 0.08em;
	cursor: pointer;
	/* Cut corners, like every UI element in the game. */
	clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
}

#status-play:hover, #status-play:focus-visible {
	background-color: #8f6bd1;
	outline: none;
	box-shadow: inset 0 0 0 3px #4fd1b8;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
/* Slow-browser hint (GDD 15.0 "Slow browser hint"): a banner over the loading screen and the game,
   shown only when the page's WebAssembly speed check runs far too slowly (a browser with its
   JavaScript JIT off interprets the game's WebAssembly, e.g. GrapheneOS Vanadium by default). */
#slow-hint {
	display: none;
	position: fixed;
	top: max(0.5rem, env(safe-area-inset-top, 0px));
	left: 50%;
	transform: translateX(-50%);
	width: min(92vw, 40rem);
	box-sizing: border-box;
	padding: 0.7rem 1rem;
	background-color: #2a2140;
	border: 2px solid #c9a227;
	color: #f2ecff;
	font: 1rem/1.35 'Trebuchet MS', 'Segoe UI', sans-serif;
	text-align: center;
	z-index: 2;
	/* Cut corners, like every UI element in the game. */
	clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
}

#slow-hint button {
	margin-top: 0.5rem;
	padding: 0.3rem 1.6rem;
	border: 0;
	background-color: #6b4fa8;
	color: #f2ecff;
	font: 700 1rem/1 'Trebuchet MS', 'Segoe UI', sans-serif;
	cursor: pointer;
}
		</style>
		<script>
// Phone and tablet helpers (see the comment at the top of this file).
(function () {
	// iPhone / iPad (iPadOS Safari reports a desktop Mac user agent, so also a Mac with touch points).
	const appleTouch = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	// iPhone silent switch: Safari treats Web Audio as "ambient" sound by default, so the
	// ring / silent switch mutes the whole game. The Audio Session API (Safari 16.4+) marks the
	// page as a media player: it plays with the switch on silent (and pauses other apps' music,
	// as a video would). Older iOS gets the same effect from a looping silent <audio> element,
	// started in the first gesture (see unlockAudio).
	const hasAudioSession = !!(navigator.audioSession && 'type' in navigator.audioSession);
	if (hasAudioSession) {
		try { navigator.audioSession.type = 'playback'; } catch (e) { /* refused: keep the default */ }
	}
	let silentLoop = null;  // The fallback <audio> element (older iOS only), created once.
	// Audio unlock: remember every AudioContext the page creates (Godot makes one at start).
	const contexts = [];
	const Base = window.AudioContext || window.webkitAudioContext;
	if (Base) {
		class TrackedAudioContext extends Base {
			constructor(options) {
				// Godot asks for its mix rate (44.1 kHz) while iPhones and iPads run their output at
				// 48 kHz; on Apple touch devices the context keeps the hardware rate instead (Godot
				// reads the real rate back and its samples carry their own rate, so nothing changes
				// pitch), which avoids Safari's resampled-context path.
				if (appleTouch && options && 'sampleRate' in options) {
					options = Object.assign({}, options);
					delete options.sampleRate;
				}
				super(options);
				contexts.push(this);
			}
		}
		window.AudioContext = TrackedAudioContext;
		if (window.webkitAudioContext) {
			window.webkitAudioContext = TrackedAudioContext;
		}
	}
	// A WAV of one second of silence (8 kHz, 8-bit mono), for the older-iOS silent loop.
	function silentWavUrl() {
		const n = 8000;  // Samples (one second at 8 kHz).
		const b = new Uint8Array(44 + n);  // Header + data bytes.
		const v = new DataView(b.buffer);
		const s = (o, t) => { for (let i = 0; i < t.length; i++) b[o + i] = t.charCodeAt(i); };
		s(0, 'RIFF'); v.setUint32(4, 36 + n, true); s(8, 'WAVEfmt '); v.setUint32(16, 16, true);
		v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true);
		v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
		s(36, 'data'); v.setUint32(40, n, true); b.fill(128, 44);
		return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
	}
	// Runs inside every gesture: Safari and Chrome only let a page start sound from a touchend,
	// click or key (not touchstart, which is where Godot resumes its AudioContext for a finger).
	function unlockAudio() {
		for (const ctx of contexts) {
			// Not only "suspended": iOS also leaves a context "interrupted" after a call, Siri,
			// the lock screen or a trip to another app, and Godot's own resume never sees that state.
			if (ctx.state !== 'running' && ctx.state !== 'closed') {
				ctx.resume().catch(() => {});
				// Older iOS also wants a sound started inside the gesture: one silent frame.
				try {
					const src = ctx.createBufferSource();
					src.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
					src.connect(ctx.destination);
					src.start(0);
				} catch (e) { /* closed meanwhile */ }
			}
		}
		if (appleTouch && !hasAudioSession && silentLoop === null) {
			silentLoop = document.createElement('audio');
			silentLoop.src = silentWavUrl();
			silentLoop.loop = true;
			silentLoop.setAttribute('playsinline', '');
			silentLoop.setAttribute('x-webkit-airplay', 'deny');
			silentLoop.play().catch(() => { silentLoop = null; });  // Refused: try again next gesture.
		}
	}
	for (const type of ['touchend', 'pointerup', 'click', 'keydown']) {
		window.addEventListener(type, unlockAudio, { capture: true, passive: true });
	}
	// Landscape lock: only possible in fullscreen, and only asked on touch devices.
	function lockLandscape() {
		const fs = document.fullscreenElement || document.webkitFullscreenElement;
		const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
		if (fs && touch && screen.orientation && screen.orientation.lock) {
			screen.orientation.lock('landscape').catch(() => {});
		}
	}
	document.addEventListener('fullscreenchange', lockLandscape);
	document.addEventListener('webkitfullscreenchange', lockLandscape);
	// Saves: ask the browser to keep this site's storage (IndexedDB, where Godot keeps
	// user://) instead of evicting it under storage pressure; quietly refused where unsupported.
	if (navigator.storage && navigator.storage.persist) {
		navigator.storage.persist().catch(() => {});
	}
	// iOS Safari ignores user-scalable=no for pinches: cancel its gesture events.
	document.addEventListener('gesturestart', (e) => e.preventDefault());
}());
		</script>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>
		<div id="safe-probe"></div>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<button id="status-play" type="button">Play</button>
			<div id="status-notice"></div>
		</div>

		<div id="slow-hint" role="alert">
			<div id="slow-hint-text"></div>
			<button id="slow-hint-close" type="button">OK</button>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// Canvas fit (GDD 15.0 "Home Screen touch offset"): this page, not Godot, sizes the canvas
// (export preset html/canvas_resize_policy = 0), as the safe area of the screen: the window
// minus the notch, status-bar and home-bar insets (all 0 on a desktop). Godot reads the new
// canvas.width / height every frame and resizes its window to match, and its touch maths
// measures the canvas rectangle on every event, so drawing and touches always agree.
(function () {
	const canvas = document.getElementById('canvas');
	const probe = document.getElementById('safe-probe');  // Holds the env(safe-area-inset-*) padding.
	function px(v) { return parseFloat(v) || 0; }  // CSS length -> px (0 when unset).
	function fitCanvas() {
		const fs = document.fullscreenElement || document.webkitFullscreenElement;  // Canvas fullscreen: the whole screen.
		const cs = getComputedStyle(probe);
		const top = fs ? 0 : px(cs.paddingTop);  // Insets (CSS px).
		const right = fs ? 0 : px(cs.paddingRight);
		const bottom = fs ? 0 : px(cs.paddingBottom);
		const left = fs ? 0 : px(cs.paddingLeft);
		const w = Math.max(1, Math.round(window.innerWidth - left - right));  // Safe area (CSS px).
		const h = Math.max(1, Math.round(window.innerHeight - top - bottom));
		const dpr = window.devicePixelRatio || 1;  // Device px per CSS px (Godot's hidpi ratio).
		canvas.style.left = `${left}px`;
		canvas.style.top = `${top}px`;
		canvas.style.width = `${w}px`;
		canvas.style.height = `${h}px`;
		const bw = Math.round(w * dpr);  // Drawing buffer (device px).
		const bh = Math.round(h * dpr);
		if (canvas.width !== bw || canvas.height !== bh) {
			canvas.width = bw;
			canvas.height = bh;
		}
		// A fixed page never scrolls on purpose; undo any scroll iOS left after a rotation.
		if (window.scrollX !== 0 || window.scrollY !== 0) {
			window.scrollTo(0, 0);
		}
	}
	fitCanvas();
	window.addEventListener('resize', fitCanvas);
	window.addEventListener('orientationchange', () => { fitCanvas(); setTimeout(fitCanvas, 300); });
	document.addEventListener('fullscreenchange', fitCanvas);
	document.addEventListener('webkitfullscreenchange', fitCanvas);
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', fitCanvas);
	}
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusPlay = document.getElementById('status-play');  // The start gate's Play button.

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusPlay.style.display = mode === 'play' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	// Slow-browser hint (GDD 15.0 "Slow browser hint"). A browser with its JavaScript JIT turned
	// off either has no WebAssembly at all (the start notice says so) or runs it in an interpreter,
	// many times slower: the game crawls or never finishes loading (GrapheneOS's Vanadium turns the
	// JIT off by default). At start the page times a tiny WebAssembly loop; when it runs far slower
	// than any JIT does, a banner says how to turn the JIT back on for this site. It measures only
	// the CPU-side WebAssembly speed, so a slow graphics chip never shows it.
	const JIT_OFF_TEXT = 'This browser has its JavaScript JIT turned off, so the game cannot run here, '
		+ 'or runs far too slowly.\nOn GrapheneOS (Vanadium): open the browser menu next to the '
		+ 'address bar, turn on JavaScript JIT for this site, then reload the page.\nIn other '
		+ 'browsers: allow JavaScript optimization (JIT) for this site in its site settings.';
	// The timed module: f(n) loops n times over a multiply-add (62 bytes, hand-assembled).
	const SPEED_MODULE = new Uint8Array([0,97,115,109,1,0,0,0,1,6,1,96,1,127,1,127,3,2,1,0,7,5,1,1,102,0,0,10,33,1,31,1,2,127,3,64,32,2,32,1,32,1,108,106,33,2,32,1,65,1,106,34,1,32,0,72,13,0,11,32,2,11]);
	const SPEED_LOOPS = 5000000;  // Loop count of the check (~3-15 ms compiled on a desktop, ~10-50 ms on a phone).
	const SPEED_SLOW_MS = 150;  // Check time (ms) above which the WebAssembly counts as interpreted.
	const slowHint = document.getElementById('slow-hint');  // The hint banner.

	// Shows the hint banner: JIT_OFF_TEXT and the line `extra` under it.
	function showSlowHint(extra) {
		document.getElementById('slow-hint-text').innerText = JIT_OFF_TEXT + '\n' + extra;
		slowHint.style.display = 'block';
	}

	// Times SPEED_LOOPS loops of SPEED_MODULE (compile included) and shows the hint when slow.
	function checkWasmSpeed() {
		try {
			const t0 = performance.now();  // Start (ms, page clock).
			const f = new WebAssembly.Instance(new WebAssembly.Module(SPEED_MODULE)).exports.f;
			f(SPEED_LOOPS);
			const ms = performance.now() - t0;  // Time the check took (ms).
			console.log('Necropathy WebAssembly speed check: ' + ms.toFixed(1) + ' ms');
			if (ms > SPEED_SLOW_MS) {
				showSlowHint('(If your browser already allows it, this device may just be too slow.)');
			}
		} catch (e) {
			console.error('WebAssembly speed check failed:', e);
		}
	}
	document.getElementById('slow-hint-close').addEventListener('click', () => {
		slowHint.style.display = 'none';
	});

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});
	if (typeof WebAssembly !== 'object') {
		missing.push('WebAssembly');  // Godot 4.3 does not check it (a browser with the JIT off may have none).
	}

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			if (missing.some((f) => f.indexOf('WebAssembly') >= 0)) {
				displayFailureNotice(JIT_OFF_TEXT + '\n\n(' + missing.join(', ') + ')');
			} else {
				displayFailureNotice(missingMsg + missing.join('\n'));
			}
		}
	} else {
		setStatusMode('progress');
		// engine.startGame() split in two (same steps as Godot 4.3's): download the engine and
		// the game pack now, start them only on the Play gesture (see the start gate above).
		const exe = GODOT_CONFIG['executable'];  // Base name of the exported files ("index").
		const pack = `${exe}.pck`;  // The game data the engine mounts as its main pack.
		engine.config.update({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		});
		let started = false;  // True once the Play gesture has started the engine.
		function play() {
			if (started) {
				return;
			}
			started = true;
			setStatusMode('progress');
			statusProgress.removeAttribute('value');
			engine.start({ 'args': ['--main-pack', pack].concat(GODOT_CONFIG['args']) }).then(() => {
				setStatusMode('hidden');
			}, displayFailureNotice);
		}
		setTimeout(checkWasmSpeed, 50);  // After the first paint of the loading screen.
		Promise.all([engine.init(exe), engine.preloadFile(pack, pack)]).then(() => {
			setStatusMode('play');
			statusPlay.focus();
			statusPlay.addEventListener('click', play);
			// A key anywhere also starts (Enter / Space on the focused button already click it).
			window.addEventListener('keydown', function onKey(e) {
				if (!e.repeat && statusMode === 'play') {
					window.removeEventListener('keydown', onKey);
					play();
				}
			});
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
