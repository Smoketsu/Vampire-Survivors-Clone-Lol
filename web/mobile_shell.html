<!DOCTYPE html>
<!--
  Necropathy Web shell (export_presets.cfg, preset "Web": html/custom_html_shell).
  Godot 4.3's stock page (godot.html: loading bar, error notice, engine start),
  unchanged in behaviour, plus phone and tablet support (GDD 15.0 "Mobile browser
  support"):
    * viewport: device width, no pinch or double-tap zoom (no viewport-fit=cover:
      the browser keeps the canvas clear of a notch, so the HUD edges and the
      touch buttons never sit under it); no scroll bounce or pull-to-refresh (fixed body,
      overscroll-behavior: none); no text selection, callout or tap highlight on
      the canvas; touch-action: none on the canvas (Godot reads every finger);
    * audio unlock: browsers start audio only from a user gesture, and iOS Safari
      and Chrome only count touchend / click (not touchstart, which is where Godot
      resumes its AudioContext for a finger). Every AudioContext the page creates
      is remembered and resumed (with one silent frame started) on every touchend,
      pointerup, click or key while it is not running, including iOS's
      "interrupted" state after a call or a trip to another app;
    * iPhone sound (GDD 15.0 "iPhone sound and fullscreen"): the page asks for the
      "playback" audio session so the ring / silent switch no longer mutes the game
      (a looping silent <audio> on iOS older than 16.4), and on Apple touch devices
      Godot's AudioContext keeps the hardware sample rate;
    * saves: the page asks for persistent storage (navigator.storage.persist), so the
      browser does not evict the IndexedDB that holds user:// under storage pressure;
    * landscape: a browser can lock the screen orientation only in fullscreen, so
      when the page enters fullscreen on a touch device it asks for landscape
      (screen.orientation.lock; refused quietly where unsupported, e.g. iOS). The
      game shows its own "turn your device" overlay otherwise (RotateOverlay).
    * start gate (GDD 15.0 "GitHub Pages is the web home"): the engine downloads at once,
      but the game starts only on a click / tap / key on the Play button. Godot creates
      its AudioContext while it starts, so it is created inside that gesture and every
      browser lets it play (Edge stayed silent when the context was made on page load and
      only resumed by a later click; itch.io's "Run game" button used to be this gesture).
  Template placeholders ($GODOT_*) are filled by the exporter.
-->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	overscroll-behavior: none;
}

body {
	position: fixed;
	inset: 0;
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	-webkit-text-size-adjust: 100%;
}

#canvas {
	display: block;
	touch-action: none;
	user-select: none;
	-webkit-user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #161a1c;  /* The game's ground colour (Palette.GROUND). */
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	/* The NECROPATHY logo (the boot splash, 246 x 90 art px) at a whole-number zoom, sharp pixels. */
	width: min(70vw, 738px);
	height: auto;
	max-height: 100%;
	max-width: 100%;
	margin: auto;
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-play {
	display: none;
	position: absolute;
	bottom: 8%;
	left: 50%;
	transform: translateX(-50%);
	min-width: 12rem;
	padding: 0.7rem 2.4rem;
	border: 0;
	background-color: #6b4fa8;
	color: #f2ecff;
	font: 700 1.6rem/1 'Trebuchet MS', 'Segoe UI', sans-serif;
	letter-spacing: 0.08em;
	cursor: pointer;
	/* Cut corners, like every UI element in the game. */
	clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
}

#status-play:hover, #status-play:focus-visible {
	background-color: #8f6bd1;
	outline: none;
	box-shadow: inset 0 0 0 3px #4fd1b8;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<script>
// Phone and tablet helpers (see the comment at the top of this file).
(function () {
	// iPhone / iPad (iPadOS Safari reports a desktop Mac user agent, so also a Mac with touch points).
	const appleTouch = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	// iPhone silent switch: Safari treats Web Audio as "ambient" sound by default, so the
	// ring / silent switch mutes the whole game. The Audio Session API (Safari 16.4+) marks the
	// page as a media player: it plays with the switch on silent (and pauses other apps' music,
	// as a video would). Older iOS gets the same effect from a looping silent <audio> element,
	// started in the first gesture (see unlockAudio).
	const hasAudioSession = !!(navigator.audioSession && 'type' in navigator.audioSession);
	if (hasAudioSession) {
		try { navigator.audioSession.type = 'playback'; } catch (e) { /* refused: keep the default */ }
	}
	let silentLoop = null;  // The fallback <audio> element (older iOS only), created once.
	// Audio unlock: remember every AudioContext the page creates (Godot makes one at start).
	const contexts = [];
	const Base = window.AudioContext || window.webkitAudioContext;
	if (Base) {
		class TrackedAudioContext extends Base {
			constructor(options) {
				// Godot asks for its mix rate (44.1 kHz) while iPhones and iPads run their output at
				// 48 kHz; on Apple touch devices the context keeps the hardware rate instead (Godot
				// reads the real rate back and its samples carry their own rate, so nothing changes
				// pitch), which avoids Safari's resampled-context path.
				if (appleTouch && options && 'sampleRate' in options) {
					options = Object.assign({}, options);
					delete options.sampleRate;
				}
				super(options);
				contexts.push(this);
			}
		}
		window.AudioContext = TrackedAudioContext;
		if (window.webkitAudioContext) {
			window.webkitAudioContext = TrackedAudioContext;
		}
	}
	// A WAV of one second of silence (8 kHz, 8-bit mono), for the older-iOS silent loop.
	function silentWavUrl() {
		const n = 8000;  // Samples (one second at 8 kHz).
		const b = new Uint8Array(44 + n);  // Header + data bytes.
		const v = new DataView(b.buffer);
		const s = (o, t) => { for (let i = 0; i < t.length; i++) b[o + i] = t.charCodeAt(i); };
		s(0, 'RIFF'); v.setUint32(4, 36 + n, true); s(8, 'WAVEfmt '); v.setUint32(16, 16, true);
		v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true);
		v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
		s(36, 'data'); v.setUint32(40, n, true); b.fill(128, 44);
		return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
	}
	// Runs inside every gesture: Safari and Chrome only let a page start sound from a touchend,
	// click or key (not touchstart, which is where Godot resumes its AudioContext for a finger).
	function unlockAudio() {
		for (const ctx of contexts) {
			// Not only "suspended": iOS also leaves a context "interrupted" after a call, Siri,
			// the lock screen or a trip to another app, and Godot's own resume never sees that state.
			if (ctx.state !== 'running' && ctx.state !== 'closed') {
				ctx.resume().catch(() => {});
				// Older iOS also wants a sound started inside the gesture: one silent frame.
				try {
					const src = ctx.createBufferSource();
					src.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
					src.connect(ctx.destination);
					src.start(0);
				} catch (e) { /* closed meanwhile */ }
			}
		}
		if (appleTouch && !hasAudioSession && silentLoop === null) {
			silentLoop = document.createElement('audio');
			silentLoop.src = silentWavUrl();
			silentLoop.loop = true;
			silentLoop.setAttribute('playsinline', '');
			silentLoop.setAttribute('x-webkit-airplay', 'deny');
			silentLoop.play().catch(() => { silentLoop = null; });  // Refused: try again next gesture.
		}
	}
	for (const type of ['touchend', 'pointerup', 'click', 'keydown']) {
		window.addEventListener(type, unlockAudio, { capture: true, passive: true });
	}
	// Landscape lock: only possible in fullscreen, and only asked on touch devices.
	function lockLandscape() {
		const fs = document.fullscreenElement || document.webkitFullscreenElement;
		const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
		if (fs && touch && screen.orientation && screen.orientation.lock) {
			screen.orientation.lock('landscape').catch(() => {});
		}
	}
	document.addEventListener('fullscreenchange', lockLandscape);
	document.addEventListener('webkitfullscreenchange', lockLandscape);
	// Saves: ask the browser to keep this site's storage (IndexedDB, where Godot keeps
	// user://) instead of evicting it under storage pressure; quietly refused where unsupported.
	if (navigator.storage && navigator.storage.persist) {
		navigator.storage.persist().catch(() => {});
	}
	// iOS Safari ignores user-scalable=no for pinches: cancel its gesture events.
	document.addEventListener('gesturestart', (e) => e.preventDefault());
}());
		</script>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<button id="status-play" type="button">Play</button>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusPlay = document.getElementById('status-play');  // The start gate's Play button.

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusPlay.style.display = mode === 'play' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		// engine.startGame() split in two (same steps as Godot 4.3's): download the engine and
		// the game pack now, start them only on the Play gesture (see the start gate above).
		const exe = GODOT_CONFIG['executable'];  // Base name of the exported files ("index").
		const pack = `${exe}.pck`;  // The game data the engine mounts as its main pack.
		engine.config.update({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		});
		let started = false;  // True once the Play gesture has started the engine.
		function play() {
			if (started) {
				return;
			}
			started = true;
			setStatusMode('progress');
			statusProgress.removeAttribute('value');
			engine.start({ 'args': ['--main-pack', pack].concat(GODOT_CONFIG['args']) }).then(() => {
				setStatusMode('hidden');
			}, displayFailureNotice);
		}
		Promise.all([engine.init(exe), engine.preloadFile(pack, pack)]).then(() => {
			setStatusMode('play');
			statusPlay.focus();
			statusPlay.addEventListener('click', play);
			// A key anywhere also starts (Enter / Space on the focused button already click it).
			window.addEventListener('keydown', function onKey(e) {
				if (!e.repeat && statusMode === 'play') {
					window.removeEventListener('keydown', onKey);
					play();
				}
			});
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
