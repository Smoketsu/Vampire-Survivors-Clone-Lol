; Necropathy export presets (Godot 4.3).
; preset.0 = Windows Desktop, preset.1 = Linux (both embed the .pck inside the
; executable so the build is a single double-clickable file), preset.2 = Web
; (no-threads browser build: index.html + .js + .wasm + .pck, any static host).
; Used locally (Project > Export) and by .github/workflows/ci.yml.

[preset.0]

; name: preset name referenced by `godot --export-release "<name>" <path>`.
name="Windows Desktop"
; platform: Godot export platform this preset targets.
platform="Windows Desktop"
; runnable: marks this as the preset used by one-click deploy for its platform.
runnable=true
; dedicated_server: false = normal client build with graphics/audio.
dedicated_server=false
; custom_features: extra feature tags (none needed).
custom_features=""
; export_filter: export every resource in the project.
export_filter="all_resources"
; include_filter / exclude_filter: extra non-resource files to include / skip
; (the font licence texts, read by the Credits screen's Licences page).
include_filter="assets/fonts/*.txt"
exclude_filter="docs/*, .github/*"
; export_path: default output path when exporting from the editor.
export_path="build/windows/Necropathy.exe"
; encryption_*: PCK encryption disabled (not needed for a prototype).
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

; custom_template/*: empty = use the official export templates.
custom_template/debug=""
custom_template/release=""
; debug/export_console_wrapper: 1 = also emit a console .exe only for debug exports.
debug/export_console_wrapper=1
; binary_format/embed_pck: pack game data inside the .exe (single file).
binary_format/embed_pck=true
; texture_format/*: desktop texture compression formats.
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
; binary_format/architecture: 64-bit Windows.
binary_format/architecture="x86_64"
; codesign/enable: no code signing (would need a certificate).
codesign/enable=false
; application/modify_resources: false = don't edit exe icon/metadata (needs rcedit, unavailable in CI).
application/modify_resources=false
; application/*: version metadata shown in Windows file properties.
application/file_version="0.6.0.0"
application/product_version="0.6.0.0"
application/company_name="Smoketsu"
application/product_name="Necropathy"
application/file_description="Necropathy"
; application/export_angle: 0 = auto (use ANGLE only where needed).
application/export_angle=0
; application/export_d3d12: 0 = don't bundle D3D12 agility SDK (Compatibility renderer uses OpenGL).
application/export_d3d12=0
; ssh_remote_deploy/enabled: remote deploy unused.
ssh_remote_deploy/enabled=false

[preset.1]

; Linux build: same settings, x86_64, single file.
name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/fonts/*.txt"
exclude_filter="docs/*, .github/*"
export_path="build/linux/Necropathy.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

; See preset.0.options for the meaning of each shared key.
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

[preset.2]

; Web build (GDD §15.0 "Web build"): a no-threads Godot 4.3 Web export, so it
; needs no SharedArrayBuffer / cross-origin isolation (COOP / COEP) headers and
; runs from any static host (itch.io, GitHub Pages, `python3 -m http.server`).
; Uses the official web_nothreads_release.zip / web_nothreads_debug.zip templates.
name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/fonts/*.txt"
exclude_filter="docs/*, .github/*"
; export_path: index.html so any static host serves the game at the folder's URL.
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.2.options]

; custom_template/*: empty = use the official export templates.
custom_template/debug=""
custom_template/release=""
; variant/extensions_support: false = no GDExtension support (none used; smaller build).
variant/extensions_support=false
; variant/thread_support: false = the no-threads build (no SharedArrayBuffer,
; no COOP / COEP headers; WorkerThreadPool tasks run on the main thread).
variant/thread_support=false
; vram_texture_compression/*: desktop browsers only (S3TC / BPTC); no mobile ETC2 / ASTC yet.
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
; html/export_icon: use the project icon (assets/ui/icon.png) as the page's favicon.
html/export_icon=true
; html/custom_html_shell / head_include: the stock Godot page (loading bar, error box).
html/custom_html_shell=""
html/head_include=""
; html/canvas_resize_policy: 2 = adaptive, the canvas fills the browser window
; (the project's canvas_items / expand stretch then scales the 1280x720 view).
html/canvas_resize_policy=2
; html/focus_canvas_on_start: give the canvas keyboard focus on load.
html/focus_canvas_on_start=true
; html/experimental_virtual_keyboard: off (desktop browsers only).
html/experimental_virtual_keyboard=false
; progressive_web_app/*: no PWA (it would also add the COOP / COEP service worker).
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
