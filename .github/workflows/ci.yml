# Necropathy CI
#
# On every push / pull request (test and export run at the same time; the
# release and publish jobs wait for both, GDD 15.0 "Parallel CI and lean testing"):
#   1. test   - one parallel job per playthrough: imports the project with Godot 4.3 headless and runs the
#               automated full playthrough (--autotest) on the Graveyard
#               (naive and army policies), on the Crimson March
#               (--stage=crimson_march) and in the Sanctum of Judgment
#               (--stage=sanctum, army policy so its objectives are
#               exercised), and on the three Act II stages (--stage=harbour,
#               archive, spire; army policy). Fails on any script error/warning or if a run
#               doesn't complete.
#   2. export - builds single-file Windows (.exe) and Linux executables and the
#               no-threads Web build (index.html + .js + .wasm + .pck, any static
#               host) and uploads them as workflow artifacts (Actions tab -> run
#               -> Artifacts: Necropathy-windows, Necropathy-linux, Necropathy-web).
# On a pushed tag starting with "v" (e.g. v0.2.0) the release job creates a
# GitHub Release with the three zips attached, so testers can just download and play.
# Its title is "Necropathy <tag>" and its body is docs/release_notes/<tag>.md
# (an empty body if that file is missing), followed by GitHub's generated changelog.
#   3. publish-pages-repo - the web home of the game (GDD 15.0 "GitHub Pages is the web
#               home"): on pushes to main, on v* tags and on a manual run of main, pushes
#               the Web build to a separate public repository served by GitHub Pages
#               (variable PAGES_REPO + secret PAGES_TOKEN; skipped without them). itch.io
#               publishing was dropped (owner decision, Oct 2026).
#   coop-net - online co-op connectivity: the relay protocol check and the two-process network test
#               against the local Python relay (tools/coop_relay*.py, tools/coop_net_test.py).
#   coop-lockstep - the co-op determinism gate: two headless processes play one full co-op run through
#               the lockstep (tools/coop_lockstep_gate.py); checksums must match the whole way. Beside
#               the other jobs (about 8-10 minutes); the release and Pages jobs do not wait for it.
#   deploy-relay - on pushes to main after coop-net: deploys the co-op relay Worker (server/relay) with
#               wrangler when the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist
#               (skipped otherwise; docs/coop/RELAY_SETUP.md).
#   4. publish-pages - OPTIONAL, off by default: deploys the Web build to this
#               repository's own GitHub Pages when the repository variable WEB_PAGES is
#               "true" (Settings -> Pages -> "GitHub Actions"; needs a public repository
#               or a paid plan). Skipped otherwise. See README "Play in the browser".

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # GODOT_VERSION: engine version the project targets (must match project.godot features).
  GODOT_VERSION: "4.3"
  # GODOT_BIN: path where the downloaded Godot editor binary is placed.
  GODOT_BIN: /home/runner/godot/Godot_v4.3-stable_linux.x86_64
  # GODOT_URL: official Linux editor build used for import, tests and export.
  GODOT_URL: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
  # TEMPLATES_URL: official export templates (needed only by the export job).
  TEMPLATES_URL: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

jobs:
  test:
    # One job per playthrough, all at once (owner request Oct 2026, GDD 15.0 "Parallel CI and lean testing"):
    # each full run takes ~3 min, so the whole set finishes in ~4 min instead of ~21 min
    # one after another. Same coverage as before.
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # fail-fast false: one failing stage does not cancel the others, so every
      # broken stage shows up in the same run.
      fail-fast: false
      matrix:
        # Each entry is one playthrough:
        #   id      - short key, used in the log file and artifact names.
        #   name    - human-readable label shown in the Actions tab.
        #   args    - autotest options after `--autotest` (--stage ignores stage locks;
        #             the army bot walks to each stage's objectives, so they run too).
        #   timeout - wall-clock limit in seconds (`timeout`), above a normal run's
        #             ~1.5-3 min; the Act II stages are slower, so they get 900 s.
        include:
          - {id: graveyard, name: "Graveyard, naive", args: "", timeout: 600}
          - {id: graveyard_army, name: "Graveyard, army policy", args: "--policy=army", timeout: 600}
          - {id: march, name: "Stage 2, the Crimson March", args: "--stage=crimson_march", timeout: 600}
          - {id: sanctum, name: "Stage 3, the Sanctum of Judgment", args: "--stage=sanctum --policy=army", timeout: 600}
          - {id: harbour, name: "Act II Stage 4, Gullhaven Harbour", args: "--stage=harbour --policy=army", timeout: 900}
          - {id: archive, name: "Act II Stage 5, the Hollow Archive", args: "--stage=archive --policy=army", timeout: 900}
          - {id: spire, name: "Act II Stage 6, Ul-Thalos", args: "--stage=spire --policy=army", timeout: 900}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: /home/runner/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        run: |
          if [ ! -x "$GODOT_BIN" ]; then
            mkdir -p "$(dirname "$GODOT_BIN")"
            curl -sSL -o /tmp/godot.zip "$GODOT_URL"
            unzip -q /tmp/godot.zip -d "$(dirname "$GODOT_BIN")"
          fi
          "$GODOT_BIN" --headless --version

      - name: Import project
        run: |
          "$GODOT_BIN" --headless --import 2>&1 | tee import.log
          if grep -qE "SCRIPT ERROR|Parse Error|ERROR:" import.log; then
            echo "::error::Script errors during import"; exit 1
          fi

      - name: Autotest (${{ matrix.name }})
        run: |
          # Exit code is 0 only when the run completes (reaches 0:00).
          # A full run is ~1220-1260 game s (20:00 countdown + Reckoning). At the
          # default --speed=8 one frame is 2/15 game s, so --quit-after 15000 frames
          # allows 2000 game s, above the autotest's own 1500 s timeout.
          # LOG: this playthrough's log file.
          LOG="autotest_${{ matrix.id }}.log"
          timeout ${{ matrix.timeout }} "$GODOT_BIN" --headless --fixed-fps 60 --quit-after 15000 -- --autotest ${{ matrix.args }} 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          if grep -qE "SCRIPT ERROR|ERROR:|WARNING:" "$LOG"; then
            echo "::error::Errors/warnings during the ${{ matrix.name }} autotest"; exit 1
          fi
          exit $status

      - name: Upload test logs
        if: always()
        # The logs are a convenience: a full artifact store must not fail the tests.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.id }}
          path: "*.log"
          # Kept 3 days (the account's artifact storage is small; GitHub's default is 90).
          retention-days: 3

  coop-net:
    # Online co-op connectivity (GDD 15.0 "Online co-op: relay and lobby"): the relay protocol check
    # against the local Python relay (tools/coop_relay_check.py, the same checks the Cloudflare Worker
    # passes under `wrangler dev`), then two headless Godot processes that make a lobby, join it by code,
    # start and exchange 10000 frames each way through it (tools/coop_net_test.py). About 2 minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: /home/runner/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        run: |
          if [ ! -x "$GODOT_BIN" ]; then
            mkdir -p "$(dirname "$GODOT_BIN")"
            curl -sSL -o /tmp/godot.zip "$GODOT_URL"
            unzip -q /tmp/godot.zip -d "$(dirname "$GODOT_BIN")"
          fi
          "$GODOT_BIN" --headless --version

      - name: Import project
        run: |
          "$GODOT_BIN" --headless --import 2>&1 | tee import.log
          if grep -qE "SCRIPT ERROR|Parse Error|ERROR:" import.log; then
            echo "::error::Script errors during import"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Relay protocol check
        run: |
          # The checker's WebSocket client (the relay itself needs only the standard library).
          pip install --quiet websockets
          python3 tools/coop_relay.py --port 8765 --quiet &
          sleep 1
          python3 tools/coop_relay_check.py http://127.0.0.1:8765

      - name: Two-process network test
        run: python3 tools/coop_net_test.py --godot "$GODOT_BIN" 2>&1 | tee coop_net.log

  coop-lockstep:
    # The co-op determinism gate (GDD 15.0 "Co-op lockstep"): two headless Godot processes play ONE
    # full co-op run (20:00 and the Reckoning) through the lockstep against the local relay, each
    # driving its own slot with the army bot; a state checksum every 60 ticks must match the whole way
    # and both must end with the same state (tools/coop_lockstep_gate.py). About 8-10 minutes, so it
    # runs beside the other jobs and the release / Pages jobs do not wait for it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: /home/runner/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        run: |
          if [ ! -x "$GODOT_BIN" ]; then
            mkdir -p "$(dirname "$GODOT_BIN")"
            curl -sSL -o /tmp/godot.zip "$GODOT_URL"
            unzip -q /tmp/godot.zip -d "$(dirname "$GODOT_BIN")"
          fi
          "$GODOT_BIN" --headless --version

      - name: Import project
        run: |
          "$GODOT_BIN" --headless --import 2>&1 | tee import.log
          if grep -qE "SCRIPT ERROR|Parse Error|ERROR:" import.log; then
            echo "::error::Script errors during import"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Two-process lockstep gate (full run)
        run: python3 tools/coop_lockstep_gate.py --godot "$GODOT_BIN" --seed 7 --wall-timeout 1500 2>&1 | tee coop_lockstep.log

      - name: Upload the gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coop-lockstep-log
          path: coop_lockstep.log
          retention-days: 3

  deploy-relay:
    # Deploys the co-op relay (server/relay, a Cloudflare Worker) on pushes to main, once the network
    # test passed, when the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist (skipped
    # cleanly otherwise; setup steps in docs/coop/RELAY_SETUP.md). The Worker serves
    # wss://necropathy-relay.<subdomain>.workers.dev (CoopNetData.RELAY_URL).
    needs: [coop-net]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # CLOUDFLARE_API_TOKEN: a token from the "Edit Cloudflare Workers" template; empty without the secret.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # CLOUDFLARE_ACCOUNT_ID: the Cloudflare account the Worker lives in; empty without the secret.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip without the Cloudflare secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; relay not deployed (docs/coop/RELAY_SETUP.md)."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: "22"

      - name: Deploy the relay Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: server/relay
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy

  export:
    # No `needs: test`: the export runs beside the playthroughs (it only builds and
    # smoke-tests); everything that ships (release, publishing) waits for both.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/godot
            ~/.local/share/godot/export_templates/4.3.stable
          key: godot-${{ env.GODOT_VERSION }}-linux-templates-win-linux-web

      - name: Download Godot and templates
        run: |
          if [ ! -x "$GODOT_BIN" ]; then
            mkdir -p "$(dirname "$GODOT_BIN")"
            curl -sSL -o /tmp/godot.zip "$GODOT_URL"
            unzip -q /tmp/godot.zip -d "$(dirname "$GODOT_BIN")"
          fi
          # TEMPLATE_DIR: where Godot looks for 4.3 export templates on Linux.
          TEMPLATE_DIR=~/.local/share/godot/export_templates/4.3.stable
          if [ ! -f "$TEMPLATE_DIR/windows_release_x86_64.exe" ] || [ ! -f "$TEMPLATE_DIR/web_nothreads_release.zip" ]; then
            mkdir -p "$TEMPLATE_DIR"
            curl -sSL -o /tmp/templates.tpz "$TEMPLATES_URL"
            # Only extract the templates we export with, to keep the cache small
            # (the Web preset is the no-threads variant: web_nothreads_*.zip).
            unzip -q -o -j /tmp/templates.tpz \
              templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe \
              templates/linux_release.x86_64 templates/linux_debug.x86_64 \
              templates/web_nothreads_release.zip templates/web_nothreads_debug.zip \
              templates/version.txt -d "$TEMPLATE_DIR"
            rm /tmp/templates.tpz
          fi

      - name: Export builds
        run: |
          mkdir -p build/windows build/linux build/web
          # build/.gdignore keeps Godot from importing the Web export's PNGs
          # (favicon, splash) as project resources.
          touch build/.gdignore
          "$GODOT_BIN" --headless --import > /dev/null 2>&1
          "$GODOT_BIN" --headless --export-release "Windows Desktop" build/windows/Necropathy.exe
          "$GODOT_BIN" --headless --export-release "Linux" build/linux/Necropathy.x86_64
          "$GODOT_BIN" --headless --export-release "Web" build/web/index.html 2>&1 | tee export_web.log
          test -s build/windows/Necropathy.exe
          test -s build/linux/Necropathy.x86_64
          test -s build/web/index.html && test -s build/web/index.wasm && test -s build/web/index.pck
          if grep -qE "SCRIPT ERROR|ERROR:" export_web.log; then
            echo "::error::Errors during the Web export"; exit 1
          fi
          # Godot 4.3 copies a sound's whole buffer on every Web play; the garbage
          # got phone tabs killed (page reload) mid-run. The patch shares the buffer
          # and fails the build if the engine's script no longer matches (GDD §15.0
          # "Web audio buffer patch").
          python3 tools/patch_web_audio.py build/web/index.js
          (cd build/windows && zip -q ../Necropathy-windows.zip Necropathy.exe)
          (cd build/linux && chmod +x Necropathy.x86_64 && zip -q ../Necropathy-linux.zip Necropathy.x86_64)
          # index.html at the zip's root, as static hosts expect.
          (cd build/web && zip -q -r ../Necropathy-web.zip .)

      - name: Smoke-test exported Linux build
        run: |
          timeout 600 build/linux/Necropathy.x86_64 --headless --fixed-fps 60 --quit-after 15000 -- --autotest 2>&1 | tee export_autotest.log
          status=${PIPESTATUS[0]}
          if grep -qE "SCRIPT ERROR|ERROR:|WARNING:" export_autotest.log; then
            echo "::error::Errors in exported build"; exit 1
          fi
          exit $status

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Necropathy-windows
          path: build/windows/Necropathy.exe
          # Kept 7 days: tagged builds live on in the GitHub Release, and the artifact store is small.
          retention-days: 7

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: Necropathy-linux
          path: build/linux/Necropathy.x86_64
          # Kept 7 days: tagged builds live on in the GitHub Release, and the artifact store is small.
          retention-days: 7

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          # The export folder (index.html at the root of the artifact zip).
          name: Necropathy-web
          path: build/web/
          # Kept 7 days (the publish jobs read it within the same run).
          retention-days: 7

      - name: Upload release zips (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          # The three zips the release job attaches once every test has passed.
          name: Necropathy-release-zips
          path: build/Necropathy-*.zip
          retention-days: 7

  # Creates the GitHub Release on a pushed v* tag, only after every playthrough
  # and the export succeeded.
  release:
    needs: [test, export]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # contents: write is needed to create a GitHub Release.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release zips
        uses: actions/download-artifact@v4
        with:
          name: Necropathy-release-zips
          path: build

      - name: Release notes file
        run: |
          # The hand-written notes for this tag; an empty file keeps the release step working without one.
          NOTES="docs/release_notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then mkdir -p docs/release_notes && : > "$NOTES"; fi
          echo "RELEASE_NOTES=$NOTES" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Necropathy ${{ github.ref_name }}
          body_path: ${{ env.RELEASE_NOTES }}
          files: |
            build/Necropathy-windows.zip
            build/Necropathy-linux.zip
            build/Necropathy-web.zip
          generate_release_notes: true

  # Optional: deploys the Web build to GitHub Pages. Runs only on pushes to
  # main and on v* tags, and only when the repository variable WEB_PAGES is
  # "true" (Settings -> Pages -> Source must be "GitHub Actions").
  publish-pages:
    # Waits for every playthrough too, so a failing test never goes live.
    needs: [test, export]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.WEB_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # pages / id-token: write are what actions/deploy-pages needs.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      # One Pages deployment at a time; a newer push waits for the running one.
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: Necropathy-web
          path: web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # Optional: publishes the Web build to its own GitHub Pages site through a separate,
  # PUBLIC repository that holds only the built game (no source), for accounts whose
  # private repositories cannot use Pages (GDD §15.0 "Save backup codes and the GitHub
  # Pages build"). iPhone Safari keeps a top-level site's saves, but forgets the saves of
  # a game embedded in another site's frame (as on itch.io) when Safari closes.
  # Runs on pushes to main and v* tags, and on a manual "Run workflow" of main (Actions
  # tab), when the repository variable PAGES_REPO (e.g. Smoketsu/NecropathyPlay) and the
  # secret PAGES_TOKEN (a fine-grained token with Contents: read and write on that
  # repository only) both exist; that repository serves its main branch root with
  # Settings -> Pages -> "Deploy from a branch".
  publish-pages-repo:
    # Waits for every playthrough too, so a failing test never goes live.
    needs: [test, export]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.PAGES_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # PAGES_TOKEN: push access to PAGES_REPO; empty when the secret does not exist.
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
      # PAGES_REPO: owner/name of the public repository that serves the build.
      PAGES_REPO: ${{ vars.PAGES_REPO }}
    steps:
      - name: Download Web build
        if: env.PAGES_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: Necropathy-web
          path: web

      - name: Push the build to the Pages repository
        if: env.PAGES_TOKEN != ''
        run: |
          # One fresh commit each time, force-pushed: the repository keeps only the latest
          # build (no history of 40 MB builds piling up).
          mkdir site && cp -r web/. site/
          # .nojekyll: serve the files as they are (no Jekyll pass).
          touch site/.nojekyll
          VERSION="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VERSION="main-${GITHUB_SHA::7}"; fi
          cd site
          git init -q -b main
          git config user.name "necropathy-ci"
          git config user.email "necropathy-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Necropathy Web build ${VERSION}"
          git push -q -f "https://x-access-token:${PAGES_TOKEN}@github.com/${PAGES_REPO}.git" HEAD:main
