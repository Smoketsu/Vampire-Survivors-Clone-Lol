# Necropathy CI
#
# On every push / pull request:
#   1. test   - imports the project with Godot 4.3 headless and runs the
#               automated full playthrough (--autotest) on the Graveyard
#               (naive and army policies), on the Crimson March
#               (--stage=crimson_march) and in the Sanctum of Judgment
#               (--stage=sanctum, army policy so its objectives are
#               exercised). Fails on any script error/warning or if a run
#               doesn't complete.
#   2. export - builds single-file Windows (.exe) and Linux executables and
#               uploads them as workflow artifacts (Actions tab -> run -> Artifacts).
# On a pushed tag starting with "v" (e.g. v0.2.0) the export job also creates a
# GitHub Release with both builds attached, so testers can just download and play.
# Its title is "Necropathy <tag>" and its body is docs/release_notes/<tag>.md
# (an empty body if that file is missing), followed by GitHub's generated changelog.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # GODOT_VERSION: engine version the project targets (must match project.godot features).
  GODOT_VERSION: "4.3"
  # GODOT_BIN: path where the downloaded Godot editor binary is placed.
  GODOT_BIN: /home/runner/godot/Godot_v4.3-stable_linux.x86_64
  # GODOT_URL: official Linux editor build used for import, tests and export.
  GODOT_URL: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
  # TEMPLATES_URL: official export templates (needed only by the export job).
  TEMPLATES_URL: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

jobs:
  test:
    runs-on: ubuntu-latest
    # Four full runs (Graveyard naive + army, Crimson March, Sanctum) of ~2-4 min each.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: /home/runner/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        run: |
          if [ ! -x "$GODOT_BIN" ]; then
            mkdir -p "$(dirname "$GODOT_BIN")"
            curl -sSL -o /tmp/godot.zip "$GODOT_URL"
            unzip -q /tmp/godot.zip -d "$(dirname "$GODOT_BIN")"
          fi
          "$GODOT_BIN" --headless --version

      - name: Import project
        run: |
          "$GODOT_BIN" --headless --import 2>&1 | tee import.log
          if grep -qE "SCRIPT ERROR|Parse Error|ERROR:" import.log; then
            echo "::error::Script errors during import"; exit 1
          fi

      - name: Autotest (full run, player invulnerable until the Reckoning)
        run: |
          # Exit code is 0 only when the run completes (reaches 0:00).
          # A full run is ~1220-1260 game s (20:00 countdown + Reckoning) and
          # takes ~1.5-2 min of wall time. At the default --speed=8 one frame
          # is 2/15 game s, so --quit-after 15000 frames allows 2000 game s,
          # above the autotest's own 1500 s timeout; `timeout 600` (wall
          # seconds) keeps both runs inside the 20-minute job limit.
          timeout 600 "$GODOT_BIN" --headless --fixed-fps 60 --quit-after 15000 -- --autotest 2>&1 | tee autotest.log
          status=${PIPESTATUS[0]}
          if grep -qE "SCRIPT ERROR|ERROR:|WARNING:" autotest.log; then
            echo "::error::Errors/warnings during autotest"; exit 1
          fi
          exit $status

      - name: Autotest (army policy)
        run: |
          timeout 600 "$GODOT_BIN" --headless --fixed-fps 60 --quit-after 15000 -- --autotest --policy=army 2>&1 | tee autotest_army.log
          status=${PIPESTATUS[0]}
          if grep -qE "SCRIPT ERROR|ERROR:|WARNING:" autotest_army.log; then
            echo "::error::Errors/warnings during army autotest"; exit 1
          fi
          exit $status

      - name: Autotest (Stage 2, the Crimson March)
        run: |
          # --stage ignores the stage lock; same pass rules as the Graveyard runs.
          timeout 600 "$GODOT_BIN" --headless --fixed-fps 60 --quit-after 15000 -- --autotest --stage=crimson_march 2>&1 | tee autotest_march.log
          status=${PIPESTATUS[0]}
          if grep -qE "SCRIPT ERROR|ERROR:|WARNING:" autotest_march.log; then
            echo "::error::Errors/warnings during Crimson March autotest"; exit 1
          fi
          exit $status

      - name: Autotest (Stage 3, the Sanctum of Judgment)
        run: |
          # --stage ignores the stage lock; the army bot walks to the ward
          # crystals and sacred altars, so the chamber / altar code runs too.
          timeout 600 "$GODOT_BIN" --headless --fixed-fps 60 --quit-after 15000 -- --autotest --stage=sanctum --policy=army 2>&1 | tee autotest_sanctum.log
          status=${PIPESTATUS[0]}
          if grep -qE "SCRIPT ERROR|ERROR:|WARNING:" autotest_sanctum.log; then
            echo "::error::Errors/warnings during Sanctum autotest"; exit 1
          fi
          exit $status

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: "*.log"

  export:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # contents: write is needed to create a GitHub Release on tag pushes.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/godot
            ~/.local/share/godot/export_templates/4.3.stable
          key: godot-${{ env.GODOT_VERSION }}-linux-templates-win-linux

      - name: Download Godot and templates
        run: |
          if [ ! -x "$GODOT_BIN" ]; then
            mkdir -p "$(dirname "$GODOT_BIN")"
            curl -sSL -o /tmp/godot.zip "$GODOT_URL"
            unzip -q /tmp/godot.zip -d "$(dirname "$GODOT_BIN")"
          fi
          # TEMPLATE_DIR: where Godot looks for 4.3 export templates on Linux.
          TEMPLATE_DIR=~/.local/share/godot/export_templates/4.3.stable
          if [ ! -f "$TEMPLATE_DIR/windows_release_x86_64.exe" ]; then
            mkdir -p "$TEMPLATE_DIR"
            curl -sSL -o /tmp/templates.tpz "$TEMPLATES_URL"
            # Only extract the templates we export with, to keep the cache small.
            unzip -q -o -j /tmp/templates.tpz \
              templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe \
              templates/linux_release.x86_64 templates/linux_debug.x86_64 \
              templates/version.txt -d "$TEMPLATE_DIR"
            rm /tmp/templates.tpz
          fi

      - name: Export builds
        run: |
          mkdir -p build/windows build/linux
          "$GODOT_BIN" --headless --import > /dev/null 2>&1
          "$GODOT_BIN" --headless --export-release "Windows Desktop" build/windows/Necropathy.exe
          "$GODOT_BIN" --headless --export-release "Linux" build/linux/Necropathy.x86_64
          test -s build/windows/Necropathy.exe
          test -s build/linux/Necropathy.x86_64
          (cd build/windows && zip -q ../Necropathy-windows.zip Necropathy.exe)
          (cd build/linux && chmod +x Necropathy.x86_64 && zip -q ../Necropathy-linux.zip Necropathy.x86_64)

      - name: Smoke-test exported Linux build
        run: |
          timeout 600 build/linux/Necropathy.x86_64 --headless --fixed-fps 60 --quit-after 15000 -- --autotest 2>&1 | tee export_autotest.log
          status=${PIPESTATUS[0]}
          if grep -qE "SCRIPT ERROR|ERROR:|WARNING:" export_autotest.log; then
            echo "::error::Errors in exported build"; exit 1
          fi
          exit $status

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Necropathy-windows
          path: build/windows/Necropathy.exe

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: Necropathy-linux
          path: build/linux/Necropathy.x86_64

      - name: Release notes file (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # The hand-written notes for this tag; an empty file keeps the release step working without one.
          NOTES="docs/release_notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then mkdir -p docs/release_notes && : > "$NOTES"; fi
          echo "RELEASE_NOTES=$NOTES" >> "$GITHUB_ENV"

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Necropathy ${{ github.ref_name }}
          body_path: ${{ env.RELEASE_NOTES }}
          files: |
            build/Necropathy-windows.zip
            build/Necropathy-linux.zip
          generate_release_notes: true
